@if (segments) {
  <nav class="registry-breadcrumb" aria-label="breadcrumb">
    <ol class="breadcrumb">
      @for (segment of segments; track segment) {
        <li class="breadcrumb-item">
          <a
            [routerLink]="segment.routerLink"
            [queryParams]="segment.queryParams"
            [attr.aria-current]="segment.active ? 'page' : null"
            [ngClass]="{ active: segment.active === true }"
          >
            {{ segment.name }}
          </a>
        </li>
      }
    </ol>
  </nav>
}
