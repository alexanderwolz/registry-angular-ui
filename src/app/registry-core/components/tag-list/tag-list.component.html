<table class="table">
  <thead>
    <tr>
      <th scope="col">Tag</th>
      <th scope="col">Platform</th>
      <th scope="col">Type</th>
    </tr>
  </thead>
  <tbody>
    @for (tag of tags; track tag) {
      <tr>
        <td>
          <a
            [routerLink]="'/repositories/' + tag.repository.getRelativePath() + '/tags/' + tag.name"
          >
            {{ tag.name }}
          </a>
        </td>
        <td>
          @for (os of tag.getPlatformNames(); track os) {
            <span [ngbTooltip]="tag.getPlatformTooltip(os)">
              {{ os }}
            </span>
          }
        </td>
        <td>
          <span placement="top" [ngbTooltip]="tag.mediaType">
            {{ tag.getType() }}
          </span>
        </td>
      </tr>
    }
    @if (showMoreLine) {
      <tr>
        <td>...</td>
        <td>...</td>
        <td>...</td>
      </tr>
    }
  </tbody>
</table>
