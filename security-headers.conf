# Security headers, included in the server block and in every location that sets its own add_header
# (nginx drops all inherited add_header directives as soon as a location defines one).

# do not guess content types, a served file is only ever treated as what we say it is
add_header X-Content-Type-Options "nosniff" always;

# the UI must not be embedded in other pages (clickjacking on login and delete buttons)
add_header X-Frame-Options "DENY" always;

# do not leak urls (repository names) to other sites
add_header Referrer-Policy "no-referrer" always;

# the UI needs none of these browser features
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Only the directives that do not depend on the registry host are set here.
# script-src/connect-src cannot be fixed statically, because REGISTRY_HOST is only known at container start.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
