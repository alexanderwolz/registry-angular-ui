worker_processes  1;
 
events {
    worker_connections  1024;
}
 
http {

    # serve static files straight from the kernel and send headers and file start in one packet
    sendfile                on;
    tcp_nopush              on;

    # do not announce the nginx version
    server_tokens           off;

    log_format              json escape=json 
                            '{'
                                '"time":"$time_iso8601",'
                                '"status":"$status",'
                                '"server_name":"$server_name",'
                                '"server_port":"$server_port",'
                                '"server_protocol":"$server_protocol",'
                                '"remote_addr":"$remote_addr",'
                                '"remote_user":"$remote_user",'
                                '"request_uri":"$request_uri",'
                                '"request_method":"$request_method",'
                                '"http_referer":"$http_referer",'
                                '"http_user_agent":"$http_user_agent",'
                                '"http_x_forwarded_for":"$http_x_forwarded_for",'
                                '"body_bytes_sent":"$body_bytes_sent"'
                            '}';

    access_log              /var/log/nginx/access.log json;
    error_log               /var/log/nginx/error.log warn;

    server {
    
        listen                  9000;

        location = /health {
            # health checks are frequent and boring, so we avoid logging them
            access_log          off;
            default_type        application/json;
            return              200 '{"status":"up"}\n';
        }

        location / {
            return              403;
        }

    }

    server {
        
        listen                  80;
 
        root                    /usr/share/nginx/html;
        index                   index.html index.htm;
        include                 /etc/nginx/mime.types;
        include                 /etc/nginx/security-headers.conf;

        # redirects (e.g. /media -> /media/) must stay relative: behind a gateway that terminates TLS
        # nginx only knows http and would send users from https back to http
        absolute_redirect       off;
 
        gzip on;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_min_length 256;
        # also compress when a gateway or CDN sits in front (the request then carries a Via header);
        # safe because Vary: Accept-Encoding is set
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

        # index.html is never cached without revalidation, otherwise users would keep the old app after an update
        location = /index.html {
            add_header          Cache-Control "no-cache";
            include             /etc/nginx/security-headers.conf;
        }

        # scripts are revalidated (cheap 304): the start script writes the runtime configuration into main-*.js
        # while the file name stays the same, so it must not be cached for good
        location ~* \.js$ {
            add_header          Cache-Control "no-cache";
            include             /etc/nginx/security-headers.conf;
        }

        # content-hashed files that never contain runtime configuration can be cached for a year
        location ~* ^/(styles-[A-Za-z0-9]+\.css|media/.+)$ {
            add_header          Cache-Control "public, max-age=31536000, immutable";
            include             /etc/nginx/security-headers.conf;
        }

        location / {
            try_files           $uri $uri/ /index.html;
        }
    }
}